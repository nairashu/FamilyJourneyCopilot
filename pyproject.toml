[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pregnancy-journey-copilot"
version = "0.1.0"
description = "AI copilot for pregnancy and newborn guidance, with timelines, education, and support for parents and partners."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.scripts]
pregnancy-copilot = "pregnancy_copilot.cli:main"

[tool.setuptools]
packages = ["pregnancy_copilot"]
